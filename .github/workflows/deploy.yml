name: Deploy to production

# Pushes to main go to prod after both smokes pass. The PR-time CI
# workflow (ci.yml) handles lint + typecheck + unit tests; this file
# only runs after main is updated.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   GCP_PROJECT_ID         — e.g. draftlegal-prod-13353
#   GCP_SA_KEY             — JSON for github-deployer SA (full file content)
#   SMOKE_ADMIN_EMAIL      — the smoke-test admin's email
#   SMOKE_ADMIN_PASSWORD   — its password. Never the development seed's
#                            password123 (X41): the seed refuses it in
#                            production, and an admin on it can be signed
#                            into by anyone who has read the README.
#
# Provision the SA + secrets once with: ./scripts/setup-github-deployer.sh

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-smoke:
        description: 'Emergency only — deploy without running the smoke gate'
        type: boolean
        default: false
      skip-rollback:
        description: 'Even if smoke fails, do NOT auto-rollback'
        type: boolean
        default: false

# Never run two deploys at the same time. New pushes queue behind the
# in-flight one rather than racing.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  GCP_REGION: us-central1
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Stage 1: deploy gotenberg → agents → api → web (in that order).
  # ─────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy gotenberg + agents + api + web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      web-url: ${{ steps.urls.outputs.web-url }}
      # What was serving before this deploy — where the rollback returns to.
      api-before:         ${{ steps.before.outputs.api-before }}
      agents-before:      ${{ steps.before.outputs.agents-before }}
      gotenberg-before:   ${{ steps.before.outputs.gotenberg-before }}
      web-version-before: ${{ steps.before.outputs.web-version-before }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version is read from package.json's "packageManager" field
        # (pnpm@9.0.0). Specifying it here too triggers ERR_PNPM_BAD_PM_VERSION.

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - id: auth
        name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # The rollback returns to exactly what was serving before this deploy.
      # It used to take each service's second-newest revision, which on
      # 2026-09-26 was a failed build that had never served, and it had no way
      # to find the web app's previous release. Never fatal: a first deploy
      # has nothing to record, and the rollback then skips that piece.
      - id: before
        name: Record what is serving now
        env:
          SITE: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          for svc in api-service agents-service gotenberg; do
            rev=$(gcloud run services describe "$svc" --region "$GCP_REGION" --format=json 2>/dev/null \
              | jq -r '[.status.traffic[]? | select(.percent > 0)] | max_by(.percent) | .revisionName // empty' || true)
            echo "$svc: ${rev:-nothing serving}"
            echo "${svc%-service}-before=${rev}" >> "$GITHUB_OUTPUT"
          done
          # The web app's live Hosting release. Only the version id is kept:
          # the full name contains the project id, which is a secret, and
          # GitHub drops a job output that contains one.
          version=$(curl -sSf -H "Authorization: Bearer $(gcloud auth print-access-token)" \
              "https://firebasehosting.googleapis.com/v1beta1/sites/${SITE}/channels/live" \
            | jq -r '.release.version.name // empty' | sed 's#.*/versions/##' || true)
          if [ -n "$version" ]; then
            echo "web app: Hosting version ${version}"
          else
            echo "::warning::Could not read the web app's live Hosting release, so a rollback of this deploy won't restore the web app."
          fi
          echo "web-version-before=${version}" >> "$GITHUB_OUTPUT"

      - id: urls
        name: Compute target URLs
        run: |
          echo "web-url=https://${{ secrets.GCP_PROJECT_ID }}.web.app" >> "$GITHUB_OUTPUT"

      - name: Deploy all services
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ env.GCP_REGION }}
          VITE_API_URL: https://${{ secrets.GCP_PROJECT_ID }}.web.app
        run: ./scripts/deploy.sh all

  # ─────────────────────────────────────────────────────────────────────
  # Stage 2: smoke gate. Hits the freshly-deployed prod URLs.
  # ─────────────────────────────────────────────────────────────────────
  smoke:
    name: Production smoke (API + UI)
    needs: deploy
    if: ${{ !inputs.skip-smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version is read from package.json's "packageManager" field
        # (pnpm@9.0.0). Specifying it here too triggers ERR_PNPM_BAD_PM_VERSION.

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install deps (needed for Playwright)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: API smoke (~60s, 49 checks)
        env:
          API_URL: https://${{ secrets.GCP_PROJECT_ID }}.web.app
          ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: node scripts/smoke-prod.mjs

      - name: UI smoke (~25s, real Chromium)
        env:
          APP_URL: https://${{ secrets.GCP_PROJECT_ID }}.web.app
          ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: node scripts/smoke-ui.mjs

      - name: Upload UI screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots-${{ github.run_id }}
          path: scripts/screenshots/smoke-ui/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────
  # Stage 3: rollback if smoke failed. Runs ONLY when deploy succeeded
  # but smoke failed (no point rolling back a deploy that itself broke).
  # ─────────────────────────────────────────────────────────────────────
  rollback:
    name: Auto-rollback (smoke failed)
    needs: [deploy, smoke]
    if: |
      always() &&
      needs.deploy.result == 'success' &&
      needs.smoke.result == 'failure' &&
      !inputs.skip-rollback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Back to exactly what was serving before this deploy, as the deploy job
      # recorded it. This pins traffic to that revision; the next deploy moves
      # it to its own new revision again (serve_latest in scripts/deploy.sh),
      # so a rollback can no longer strand every later deploy.
      - name: Roll Cloud Run services back to what was serving
        env:
          API_BEFORE:       ${{ needs.deploy.outputs.api-before }}
          AGENTS_BEFORE:    ${{ needs.deploy.outputs.agents-before }}
          GOTENBERG_BEFORE: ${{ needs.deploy.outputs.gotenberg-before }}
        run: |
          rollback() {
            if [ -z "$2" ]; then
              echo "Skipping $1 — nothing was recorded as serving before this deploy"
              return
            fi
            echo "Rolling $1 back to $2"
            gcloud run services update-traffic "$1" \
              --to-revisions="$2=100" \
              --region "${{ env.GCP_REGION }}" \
              --quiet
          }
          rollback agents-service "$AGENTS_BEFORE"
          rollback api-service "$API_BEFORE"
          rollback gotenberg "$GOTENBERG_BEFORE"

      # The web app calls the API it was built with, so it goes back too: a new
      # release of the version that was live before this deploy. (The step used
      # to run `firebase hosting:rollback`, which isn't a Firebase command; the
      # error was swallowed and the web app never rolled back.) The marketing
      # site doesn't depend on the API and stays as deployed.
      - name: Roll the web app back to its previous release
        env:
          SITE: ${{ secrets.GCP_PROJECT_ID }}
          VERSION: ${{ needs.deploy.outputs.web-version-before }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "Skipping the web app — no live release was recorded before this deploy"
            exit 0
          fi
          curl -sSf -X POST \
              -H "Authorization: Bearer $(gcloud auth print-access-token)" \
              -H "Content-Type: application/json" \
              -d "{\"message\": \"Auto-rollback: the smoke gate failed in run ${GITHUB_RUN_ID}\"}" \
              "https://firebasehosting.googleapis.com/v1beta1/sites/${SITE}/channels/live/releases?versionName=sites/${SITE}/versions/${VERSION}" \
            | jq -r '"Web app release created: version " + (.version.name | sub(".*/versions/"; ""))'

      - name: Annotate run summary
        env:
          API_BEFORE:       ${{ needs.deploy.outputs.api-before }}
          AGENTS_BEFORE:    ${{ needs.deploy.outputs.agents-before }}
          GOTENBERG_BEFORE: ${{ needs.deploy.outputs.gotenberg-before }}
          WEB_BEFORE:       ${{ needs.deploy.outputs.web-version-before }}
        run: |
          {
            echo "## ⛔ Auto-rollback executed"
            echo ""
            echo "The smoke gate failed against the new deploy, so traffic went back"
            echo "to what was serving before it:"
            echo ""
            echo "- api-service: \`${API_BEFORE:-unchanged}\`"
            echo "- agents-service: \`${AGENTS_BEFORE:-unchanged}\`"
            echo "- gotenberg: \`${GOTENBERG_BEFORE:-unchanged}\`"
            echo "- web app: Hosting version \`${WEB_BEFORE:-unchanged}\`"
            echo ""
            echo "The marketing site stays as deployed. The next deploy serves its own"
            echo "new revisions again."
            echo ""
            echo "**Next steps:**"
            echo "1. Read the failed smoke job's logs for the specific failure."
            echo "2. Fix the underlying bug on \`main\` (or a hotfix branch)."
            echo "3. Push the fix and re-deploy."
          } >> "$GITHUB_STEP_SUMMARY"
