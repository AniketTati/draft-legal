name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck-and-lint:
    name: Typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the root package.json "packageManager"
      # field — do NOT also pin it here or action-setup errors with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # pnpm v9 does not run dependency postinstall scripts by default, so the
      # Prisma client is never generated on install. apps/api's tsc needs the
      # generated client's types, so generate it explicitly before typecheck.
      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Typecheck all packages
        run: pnpm typecheck

      # Wave 5 — real lint (eslint was referenced but never installed). Lean
      # high-signal ruleset; fails only on errors, warnings are allowed.
      - name: Lint
        run: pnpm lint

  bundle-size:
    # Production audit (2026-04-30): web bundle ballooned to 833KB
    # gzip on first paint. Code-split into editor / pdf / charts /
    # tanstack / icons chunks; check-bundle-size.mjs enforces a per-
    # chunk gzip budget so this can't regress without a PR-level
    # discussion.
    name: Web bundle-size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Build web + verify chunk sizes
        working-directory: apps/web
        run: pnpm build:check

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clm
          POSTGRES_PASSWORD: clm
          POSTGRES_DB: clm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://clm:clm@localhost:5432/clm_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-integration-jwt-secret-32chars-minimum
      PORTAL_JWT_SECRET: ci-integration-portal-secret-32chars-min
      INTERNAL_SERVICE_SECRET: ci-integration-internal-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # pnpm v9 skips dependency postinstall scripts, so generate the Prisma
      # client explicitly — the tests import @prisma/client at module load.
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm db:generate

      - name: Run DB migrations
        working-directory: apps/api
        run: pnpm db:migrate:prod

      - name: Run API tests (unit)
        working-directory: apps/api
        run: pnpm test

      # Integration suite — boots the real Fastify app against the Postgres +
      # Redis service containers and exercises routes via app.inject()
      # (cross-org isolation, RBAC, approval state machine). Wave 5.
      - name: Run API tests (integration)
        working-directory: apps/api
        run: pnpm test:integration

  test-agents:
    name: Test Agents (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/agents/requirements.txt

      # There are no Python tests yet, so this install is the only real gate in
      # this job — and it earns its keep: an unsatisfiable requirements.txt
      # broke it (and the agents image build) for a full day in Aug 2026.
      - name: Install dependencies
        working-directory: apps/agents
        run: pip install -r requirements.txt

      # Installing is not the same as installing something coherent. pip will
      # leave a requirement unsatisfied when packages arrive in separate steps,
      # which is how the dev venv ended up on langchain-core 1.x under adapters
      # that forbid it. `pip check` is the only thing that says so out loud.
      - name: Verify the resolved set is self-consistent
        working-directory: apps/agents
        run: pip check

      # The app importing proves every route module loads under the resolved
      # versions — the langchain packages move imports between majors, and a
      # resolve that succeeds can still produce a container that cannot boot.
      - name: Import the app
        working-directory: apps/agents
        run: python -c "import main; print(f'{len(main.app.routes)} routes loaded')"

      # There are no Python tests yet. The pytest step that used to sit here ran
      # `pytest tests/ -v --tb=short || true` against a directory that does not
      # exist — three independent reasons it could never fail. It has been
      # replaced by the `agent-evals` job below, which can. See docs/37 E1.

  # ── Agent eval suite — docs/37, ADR-01 ────────────────────────────────────
  # Its own job so it has a name in the checks list and a node runtime. Tier 1
  # is static analysis: no services, no database, no model key, well under a
  # second. That is what makes it safe to block every PR on, including forks,
  # which cannot read repo secrets.
  agent-evals:
    name: Agent evals (tier 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --check-baseline is what makes this more than a pass/fail run: it also
      # fails when a check DISAPPEARS or quietly asserts less than it used to.
      # Deleting an inconvenient check must not be a way to go green.
      - name: Run tier 1
        run: node scripts/evals/run.mjs --tier t1 --check-baseline
