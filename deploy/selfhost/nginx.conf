# nginx for the self-hosted web tier (docker-compose.selfhost.yml).
#
# Serves the built Vite SPA and reverse-proxies /api to api-service so the
# browser talks to a single origin (no CORS, cookies stay first-party).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API + realtime collab → api-service (internal compose network).
  location /api/ {
    proxy_pass http://api-service:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # X38 — the internal headers are for the agents service, which calls the
    # API directly on the compose network. Nothing legitimate sends them
    # through here, so the edge drops them.
    proxy_set_header X-Internal-Secret "";
    proxy_set_header X-Internal-Service "";
    proxy_set_header X-Org-Id "";
    # WebSocket upgrade (Hocuspocus collab).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    client_max_body_size 50m;   # contract uploads
  }

  # SPA fallback — every non-file route serves index.html so client routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache the hashed asset bundles; never cache index.html.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # X49 — the PDF viewer's worker is an ES module (.mjs), which browsers run
  # only when it's served as JavaScript; nginx's default mime.types has no
  # mjs entry and would send application/octet-stream.
  location ~* \.mjs$ {
    types { application/javascript mjs; }
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
