# Non-secret env vars for agents-service. Copy to env.agents.yaml and fill in.
# Secrets (LLM API keys, INTERNAL_SERVICE_SECRET) come from Secret Manager.

HOST: 0.0.0.0
PORT: "8080"

# Default model routing (apps/agents/app/config.py reads these).
DEFAULT_PROVIDER: anthropic
DEFAULT_MODEL: claude-sonnet-4-6

# LLM observability — Langfuse Cloud (free hobby tier) for Cloud Run.
# The two keys are NOT here: scripts/deploy.sh binds LANGFUSE_PUBLIC_KEY /
# LANGFUSE_SECRET_KEY from Secret Manager, and only if both secrets exist
# (missing = deploy proceeds untraced). Use https://us.cloud.langfuse.com or
# https://eu.cloud.langfuse.com to match the region your Langfuse project was
# created in — a mismatch authenticates fine but shows zero traces.
# Local dev points this at the self-hosted OSS instance on http://localhost:3100
# instead. See docs/operations/LANGFUSE.md.
LANGFUSE_HOST: https://cloud.langfuse.com
